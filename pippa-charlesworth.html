<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artist Name — Bio</title>

<!--
  =====================================================================
  HOW TO REUSE THIS FOR EACH ARTIST
  =====================================================================
  1. Copy this whole file and rename it, e.g. artist-2.html
  2. Scroll down to the "EDIT ME" script block near the bottom.
     That's the ONLY place you need to type text and image paths.
  3. Put each artist's images in a folder like /images/artist-2/
     and point the "src" fields at them.
  4. Push to GitHub, turn on GitHub Pages (Settings > Pages), and
     encode each artist's live page URL onto their own RFID/NFC tag.
  =====================================================================
-->

<style>
  :root{
    --paper:   #EDEAE2;
    --ink:     #1A1917;
    --muted:   #6B6558;
    --line:    #C9C2B4;
    --accent:  #9C7C3C;
    --paper-raise: #F6F4EF;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin:0;
    background: var(--ink);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 3rem;
  }

  img{ max-width:100%; display:block; }

  /* ---------- Eyebrow / label typography (museum wall-label feel) ---------- */
  .plate{
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Faded background image, fixed behind the whole page ---------- */
  .bg-banner{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--ink);
  }
  .bg-banner .bg-slide{
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1400ms ease;
  }
  .bg-banner .bg-slide.is-active{ opacity: 1; }
  .bg-banner .bg-slide img{
    width: 100%; height: 100%; object-fit: cover;
  }
  /* the "slightly faded" look: light tint over the whole image */
  .bg-banner::before{
    content:"";
    position:absolute; inset:0;
    background: var(--paper);
    opacity: 0.15;
    z-index: 1;
  }

  .content{
    position: relative;
    z-index: 1;
  }

  .header{
    position: relative;
    padding: 3.5rem 1.25rem 1.5rem;
  }
  .header .plate{
    margin-bottom: 0.6rem;
    color: var(--muted);
  }
  .header h1{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-optical-sizing: auto;
    font-size: 2.8rem;
    line-height: 0.98;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .header .role{
    font-size: 0.98rem;
    color: var(--muted);
    margin: 0;
  }

  /* ---------- Bio, in its own boxed card ---------- */
  .bio-card{
    margin: 0 1.25rem 1.75rem;
    padding: 1.4rem 1.25rem;
    background: var(--paper-raise);
    border: 1px solid var(--line);
  }
  .bio-card p{
    font-size: 1.02rem;
    line-height: 1.65;
    margin: 0 0 1rem;
    color: var(--ink);
  }
  .bio-card p:last-child{ margin-bottom: 0; }

  /* ---------- Flipbook: auto-cycling images ---------- */
  .works{ padding: 0 1.25rem 0.5rem; border-top: 1px solid var(--line); padding-top: 1.75rem; }
  .works > .plate{ margin-bottom: 1rem; display:block; }

  .flipbook{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    perspective: 1400px;
    border: 1px solid var(--line);
    background: var(--paper-raise);
  }
  .flip-page{
    position: absolute;
    inset: 0.6rem;
    transform-style: preserve-3d;
    transition: transform 900ms cubic-bezier(.5,.05,.15,1), opacity 900ms ease;
    opacity: 0;
    transform: rotateX(0deg);
    backface-visibility: hidden;
  }
  .flip-page img{
    width: 100%; height: 100%; object-fit: cover;
  }
  .flip-page.is-active{
    opacity: 1;
    z-index: 2;
  }
  .flip-page.is-leaving{
    opacity: 1;
    z-index: 3;
    transform: rotateX(-100deg);
    transform-origin: top;
  }
  .flip-page.is-entering{
    opacity: 1;
    z-index: 2;
    animation: flipIn 900ms cubic-bezier(.5,.05,.15,1) forwards;
  }
  @keyframes flipIn{
    from{ transform: rotateX(100deg); transform-origin: bottom; }
    to{ transform: rotateX(0deg); transform-origin: bottom; }
  }

  /* ---------- Links ---------- */
  .links{
    margin: 1.75rem 1.25rem 0;
    padding: 1.4rem 1.25rem 0.5rem;
    background: var(--paper-raise);
    border: 1px solid var(--line);
  }
  .links > .plate{ margin-bottom: 1rem; display:block; }
  .link-row{
    display:flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }
  .link-row a{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.95rem 0.1rem;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 1rem;
  }
  .link-row a .arrow{
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    transition: transform 180ms ease;
  }
  .link-row a:active .arrow{ transform: translateX(3px); }

  @media (prefers-reduced-motion: reduce){
    .bg-banner .bg-slide{ transition: opacity 200ms ease; }
    .flip-page{ transition: opacity 300ms ease; transform: none !important; }
    .flip-page.is-leaving{ transform: none; }
    .flip-page.is-entering{ animation: none; }
  }

  @media (min-width: 640px){
    body{ max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="bg-banner" id="bgBanner">
  <!-- cycling background slides injected here -->
</div>

<div class="content">

<div class="header">
  <span class="plate" id="eyebrowText">ARTIST</span>
  <h1 id="artistName">Name Here</h1>
  <p class="role" id="artistRole">Discipline / medium</p>
</div>

<div class="bio-card" id="bioContainer">
  <!-- bio paragraphs injected here -->
</div>

<div class="works">
  <div class="flipbook" id="flipbook">
    <!-- flip pages injected here -->
  </div>
</div>

<div class="links">
  <span class="plate">Connect</span>
  <div class="link-row" id="linksContainer">
    <!-- links injected here -->
  </div>
</div>

</div>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   EDIT ME — this is the only section you need to touch per artist
   ===================================================================== */
const ARTIST = {

  eyebrow: "ARTIST",

  name: "Pippa Charlesworth",

  role: "Site Specific Artist",

  cycleSeconds: 4,

  backgroundImages: [
    "images/pippa-charlesworth/bg-1.png"
  ],

  bio: [
    "My work responds to the surviving iron shield frames within Fort Gilkicker's casements, dating from the 1860s. They embody a period of rapid technological change, when the fort's design was adapted during construction. The ironwork records experimentation, development and eventual obsolescence.",
    "I translate this history through transparent material. Rather than documenting the frames, transparency echoes the casements' original function: allowing vision and fire outward while protecting the people and machinery within. The fort's granite, brick and iron solidity becomes lighter and more fragile.",
    "Light passing through the work evokes the disappearance of the fort's military function while preserving its material memory. The work becomes a ghost of the architecture—present yet functionally absent.",
    "Through experimentation and alteration, the making process mirrors the fort's evolving design. The work is both a material response and a record, considering how memory and function remain embedded in structures long after their technologies become obsolete."
  ],

  works: [
    { image: "images/pippa-charlesworth/work-1.png" },
    { image: "images/pippa-charlesworth/work-2.png" },
    { image: "images/pippa-charlesworth/work-3.png" },
    { image: "images/pippa-charlesworth/work-4.png" },
    { image: "images/pippa-charlesworth/work-5.png" },
    { image: "images/pippa-charlesworth/work-6.png" },
    { image: "images/pippa-charlesworth/work-7.png" }
  ],

  links: [
    { label: "Instagram", url: "https://www.instagram.com/pippacharlesworth" },
    { label: "Website", url: "https://pippacharlesworth.com" },
    { label: "Email", url: "mailto:pippi@btinternet.com" }
  ]
};
/* ===================================================================== */


// --- rendering logic below: no need to edit ---
document.getElementById('eyebrowText').textContent = ARTIST.eyebrow;
document.getElementById('artistName').textContent = ARTIST.name;
document.getElementById('artistRole').textContent = ARTIST.role;
document.title = ARTIST.name + " — Bio";

const bioContainer = document.getElementById('bioContainer');
ARTIST.bio.forEach(paragraph => {
  const p = document.createElement('p');
  p.textContent = paragraph;
  bioContainer.appendChild(p);
});

const linksContainer = document.getElementById('linksContainer');
ARTIST.links.forEach(link => {
  const a = document.createElement('a');
  a.href = link.url;
  a.innerHTML = `<span>${link.label}</span><span class="arrow">→</span>`;
  linksContainer.appendChild(a);
});

/* ---------- Background banner: fades between its own images ---------- */
const bgBanner = document.getElementById('bgBanner');
ARTIST.backgroundImages.forEach((src, i) => {
  const slide = document.createElement('div');
  slide.className = 'bg-slide' + (i === 0 ? ' is-active' : '');
  slide.innerHTML = `<img src="${src}" alt="">`;
  bgBanner.appendChild(slide);
});
const bgSlides = bgBanner.querySelectorAll('.bg-slide');
let bgCurrent = 0;
if (bgSlides.length > 1){
  setInterval(() => {
    const prev = bgCurrent;
    bgCurrent = (bgCurrent + 1) % bgSlides.length;
    bgSlides[prev].classList.remove('is-active');
    bgSlides[bgCurrent].classList.add('is-active');
  }, (ARTIST.cycleSeconds || 4) * 1000);
}

/* ---------- Flipbook: pages that flip through the work images ---------- */
const flipbook = document.getElementById('flipbook');

ARTIST.works.forEach((work, i) => {
  const page = document.createElement('div');
  page.className = 'flip-page' + (i === 0 ? ' is-active' : '');
  page.innerHTML = `<img src="${work.image}" alt="">`;
  flipbook.appendChild(page);
});
const flipPages = flipbook.querySelectorAll('.flip-page');

let current = 0;
const totalSlides = ARTIST.works.length;
const intervalMs = (ARTIST.cycleSeconds || 4) * 1000;

function goToSlide(next){
  const prev = current;
  current = next;

  const leavingPage = flipPages[prev];
  const enteringPage = flipPages[current];
  leavingPage.classList.remove('is-active');
  leavingPage.classList.add('is-leaving');
  enteringPage.classList.add('is-entering');

  setTimeout(() => {
    leavingPage.classList.remove('is-leaving');
    enteringPage.classList.remove('is-entering');
    enteringPage.classList.add('is-active');
  }, 900);
}

setInterval(() => {
  if (totalSlides < 2) return;
  goToSlide((current + 1) % totalSlides);
}, intervalMs);
</script>

</body>
</html>
